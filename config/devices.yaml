# config/devices.yaml
# ──────────────────────────────────────────────────────────────────────────────
# Add one entry per FortiGate device.
# The device named "default" is reserved for env-var credentials;
# entries below are merged in and override any duplicate names.
# ──────────────────────────────────────────────────────────────────────────────

devices:
  # ── Example: Main HQ Firewall ────────────────────────────────────────────
  # - name: hq-fw          # registry key used in tool calls
  #   host: https://10.0.0.1
  #   api_token: token-here
  #   vdom: root
  #   verify_ssl: true

  # ── Example: Branch Office Firewall ─────────────────────────────────────
  # - name: branch-fw
  #   host: https://10.0.1.1
  #   api_token: token-here
  #   vdom: root
  #   verify_ssl: true

  # ── Example: Lab/Dev Firewall (self-signed cert) ─────────────────────────
  # - name: lab-fw
  #   host: https://192.168.1.1
  #   api_token: token-here
  #   vdom: lab-vdom
  #   verify_ssl: false      # set false for self-signed certs only
